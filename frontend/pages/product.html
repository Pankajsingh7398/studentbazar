<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Product Details — StudentBazaar</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&amp;family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#281207",
            "primary-container": "#402619",
            "on-primary": "#ffffff",
            "secondary": "#7c5544",
            "secondary-container": "#ffccb6",
            "background": "#fcf9f2",
            "surface": "#fcf9f2",
            "surface-container-low": "#f6f3ec",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#1c1c18",
            "on-surface-variant": "#50443f"
          }
        }
      }
    };
  </script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../style.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/forms.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>

  <!-- Scripts -->
  <script src="../js/api.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/cart.js" defer></script>
  <script src="../js/wishlist.js" defer></script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 bg-surface-container-lowest shadow-[0_1px_8px_rgba(64,38,25,0.06)]">
    <div class="h-16 max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-3">
        <img alt="StudentBazaar Logo" class="h-7 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBfk-NrrJ5RzQXwJw08BU_qg0Y4allogKU6fTKcbIO1nzQEFH34kxJVE_d2XPH-sBtCgynFid6tENHv2KWIP9NpAe8f-KX8P6bteWyfamKZF52-6NuD7UXNen6suEgDj-s3Cvx8k8eSeLsAPnLN0RKEn0FOOTAFAl-2DRElnNxDkvPdnIjmQgmaQ5okgQ_VeK872BCl5KqA2J0fUqp-5cMOih8_LaLKn3Ider1GGuEw6rKWyu_4MvgISA"/>
        <span class="font-headline-sm text-headline-sm text-primary font-serif">StudentBazaar</span>
      </a>

      <div class="flex items-center gap-4">
        <a class="text-label-md font-label-md text-on-surface-variant hover:text-primary transition" href="shop.html">Shop All</a>
        <a aria-label="Cart" class="relative p-1.5 text-on-surface-variant hover:text-primary transition" data-path="cart" href="#">
          <span class="material-symbols-outlined text-[22px]">shopping_bag</span>
          <span class="cart-badge absolute -top-1 -right-1 bg-primary text-on-primary text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Product Detail Section -->
  <main class="w-full pt-28 pb-16 max-w-7xl mx-auto px-4 sm:px-6" id="product-detail-container">
    <div class="flex items-center justify-center py-24 text-on-surface-variant">
      <div class="spinner mr-3"></div>
      <span>Loading archival product specifications...</span>
    </div>
  </main>

  <!-- Toast Notification -->
  <div class="fixed top-24 right-6 z-50 transform translate-y-[-20px] opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-space-sm bg-primary text-on-primary px-space-md py-space-sm rounded-xl shadow-xl" id="toast">
    <span class="material-symbols-outlined text-[18px] text-primary-fixed" id="toast-icon">check_circle</span>
    <span class="font-label-md text-label-md" id="toast-message">Item updated</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      window.showToast = function(msg, icon = 'check_circle') {
        const toast = document.getElementById('toast');
        document.getElementById('toast-message').textContent = msg;
        document.getElementById('toast-icon').textContent = icon;
        toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
        toast.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
          toast.classList.remove('opacity-100', 'translate-y-0');
        }, 2800);
      };

      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id') || 'motivational-notebook';

      try {
        const res = await window.apiRequest(`/products/${productId}`);
        if (res && res.success && res.data.product) {
          renderProductDetails(res.data.product);
        }
      } catch (e) {
        document.getElementById('product-detail-container').innerHTML = `
          <div class="py-16 text-center text-on-surface-variant">
            <p class="font-headline-sm text-primary mb-2">Product Not Found</p>
            <p class="mb-4">The requested notebook may be unavailable or moved.</p>
            <a href="shop.html" class="px-4 py-2 bg-primary text-on-primary rounded-lg">Return to Catalog</a>
          </div>
        `;
      }
    });

    function renderProductDetails(p) {
      document.title = `${p.name} — StudentBazaar`;
      const container = document.getElementById('product-detail-container');
      const mockupClass = p.mockupStyle || 'bg-[#1C3627] text-amber-200';
      const specs = p.specifications ? Object.entries(p.specifications) : [];

      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-12 gap-10 items-start">
          <!-- Left Column: Realistic Notebook Mockup Visualizer -->
          <div class="md:col-span-6 bg-surface-container-lowest p-8 sm:p-12 rounded-3xl border border-surface-container shadow-xs flex items-center justify-center">
            <div class="relative w-64 sm:w-72 h-88 sm:h-96 rounded-xl shadow-2xl flex flex-col justify-between p-6 transform -rotate-1 hover:rotate-0 transition-transform duration-300 ${mockupClass} notebook-mockup-shadow">
              <div class="absolute left-0 top-0 bottom-0 w-3 bg-black/25 rounded-l-xs shadow-inner"></div>
              <div class="flex items-center justify-between">
                <span class="material-symbols-outlined text-[24px]">auto_stories</span>
                <span class="font-label-sm text-[10px] tracking-widest uppercase opacity-75">Archival Series</span>
              </div>
              <div class="my-auto text-center space-y-2">
                <h2 class="font-headline-display text-[26px] leading-tight font-serif font-bold">${p.coverSnippet || p.name}</h2>
                <div class="w-10 h-[2px] bg-current opacity-40 mx-auto"></div>
                <p class="font-body-sm text-[12px] opacity-80 italic">${p.shortDescription || '100 GSM • Smooth Ivory'}</p>
              </div>
              <div class="flex items-center justify-between text-[10px] opacity-60 uppercase font-mono">
                <span>ISO 216</span>
                <span>StudentBazaar</span>
              </div>
            </div>
          </div>

          <!-- Right Column: Specs & Purchasing Controls -->
          <div class="md:col-span-6 space-y-6">
            <div>
              <div class="flex items-center gap-2 mb-2">
                <span class="px-2.5 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm font-semibold">
                  ${p.badge || 'Archival Edition'}
                </span>
                <span class="text-body-sm text-secondary font-medium">• ${p.category?.name || 'Notebooks'}</span>
              </div>
              <h1 class="font-headline-lg text-headline-lg text-primary font-serif mb-3">${p.name}</h1>
              <p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed mb-4">${p.description}</p>
              
              <div class="flex items-baseline gap-3 my-4">
                <span class="font-headline-display text-[32px] text-primary">₹${p.price}</span>
                ${p.compareAtPrice ? `<span class="text-on-surface-variant line-through text-body-lg">₹${p.compareAtPrice}</span>` : ''}
                <span class="text-label-sm text-secondary font-bold font-mono">Campus Subsidy Applied</span>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-4 pt-2">
              <div class="flex items-center bg-surface-container rounded-xl overflow-hidden border border-outline-variant">
                <button class="w-10 h-11 flex items-center justify-center hover:bg-surface-variant text-primary font-bold text-lg" onclick="changeQty(-1)">-</button>
                <input id="detail-qty-input" type="number" value="1" min="1" max="${p.stock}" class="w-12 text-center bg-transparent font-label-lg text-primary focus:outline-none"/>
                <button class="w-10 h-11 flex items-center justify-center hover:bg-surface-variant text-primary font-bold text-lg" onclick="changeQty(1)">+</button>
              </div>

              <button class="flex-1 py-3.5 bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg hover:bg-primary transition shadow-md flex items-center justify-center gap-2" onclick="addCurrentToCart('${p._id}', '${p.name}', ${p.price}, '${mockupClass}')">
                <span class="material-symbols-outlined text-[20px]">add_shopping_cart</span>
                <span>Add to Study Kit</span>
              </button>

              <button class="w-12 h-12 rounded-xl bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-primary transition" onclick="toggleCurrentWishlist('${p._id}', '${p.name}', ${p.price})">
                <span class="material-symbols-outlined text-[22px]">favorite</span>
              </button>
            </div>

            <!-- Technical Specifications Table -->
            ${specs.length > 0 ? `
              <div class="pt-6 border-t border-surface-container">
                <h3 class="font-headline-sm text-headline-sm text-primary font-serif mb-3">Academic Specifications</h3>
                <div class="bg-surface-container-lowest rounded-2xl border border-surface-container overflow-hidden divide-y divide-surface-container">
                  ${specs.map(([k, v]) => `
                    <div class="flex justify-between py-2.5 px-4 text-body-sm">
                      <span class="text-on-surface-variant font-medium">${k}</span>
                      <span class="text-primary font-semibold text-right">${v}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function changeQty(delta) {
      const input = document.getElementById('detail-qty-input');
      if (!input) return;
      const current = parseInt(input.value, 10) || 1;
      input.value = Math.max(1, current + delta);
    }

    function addCurrentToCart(id, name, price, mockupStyle) {
      const qty = parseInt(document.getElementById('detail-qty-input')?.value, 10) || 1;
      window.CartManager.addItem({ id, name, price, mockupStyle }, qty);
    }

    function toggleCurrentWishlist(id, name, price) {
      window.WishlistManager.toggle({ id, name, price });
    }
  </script>
</body>
</html>
